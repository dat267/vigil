[package]
name = "vigil"
version = "0.0.1"
edition = "2021"
description = "Keep your system awake — cross-platform sleep inhibitor"
license = "MIT"
repository = "https://github.com/dat267/vigil"
homepage = "https://github.com/dat267/vigil"
keywords = ["sleep", "inhibit", "caffeinate", "keep-awake"]
categories = ["command-line-utilities"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
