name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME:      ${{ vars.BIN_NAME || github.event.repository.name }}
  KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '3' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            pkg: ""
            linker: ""
            strip: strip
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            pkg: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            ext: ""
            pkg: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            pkg: ""
            linker: ""
            strip: strip
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            pkg: ""
            linker: ""
            strip: strip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            pkg: ""
            linker: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
            pkg: ""
            linker: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross toolchain (Linux)
        if: matrix.pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}

      - name: Set cross-compilation linker
        if: matrix.linker != ''
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.strip }} target/${{ matrix.target }}/release/vigil${{ matrix.ext }}

      - name: Rename binary
        run: |
          SRC="target/${{ matrix.target }}/release/vigil${{ matrix.ext }}"
          DST="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}"
          mv "$SRC" "$DST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute release tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${{ env.BIN_NAME }}/${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${{ env.BIN_NAME }}/${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ steps.meta.outputs.tag }}
          name:                   ${{ steps.meta.outputs.name }}
          target_commitish:       ${{ github.sha }}
          generate_release_notes: true
          files: "*"

      - name: Clean up old releases (keep ${{ env.KEEP_RELEASES }} most recent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: |
          PREFIX="${{ env.BIN_NAME }}/"
          releases=$(gh release list --limit 100 --json tagName \
            | jq -r '.[].tagName' | grep "^${PREFIX}")
          count=0
          for tag in $releases; do
            count=$((count + 1))
            if [ "$count" -gt "${{ env.KEEP_RELEASES }}" ]; then
              echo "Deleting: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            else
              echo "Keeping:  $tag"
            fi
          done
