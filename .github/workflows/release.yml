name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BIN_NAME:      vigil
  KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '3' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # macOS is build-only in the matrix (no test job), so its cfg surface
      # must be type-checked here, before the expensive build stage. Local dev
      # machines only compile the Linux cfg — exactly how POSIX items got
      # Linux-gated and broke the macOS build.
      - run: rustup target add aarch64-apple-darwin
      - run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: cargo test
      - run: cargo run --quiet -- --version

  # The guard tests only need POSIX tools, so macOS runs the real
  # spawn/kill/reap path instead of only type-checking it.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: cargo test

  build:
    needs: [test, test-windows, test-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            pkg: ""
            linker: ""
            strip: strip
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            pkg: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            ext: ""
            pkg: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            pkg: ""
            linker: ""
            strip: strip
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            pkg: ""
            linker: ""
            strip: strip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            pkg: ""
            linker: ""
            strip: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
            pkg: ""
            linker: ""
            strip: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross toolchain (Linux)
        if: matrix.pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}

      - name: Set cross-compilation linker
        if: matrix.linker != ''
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.strip }} target/${{ matrix.target }}/release/vigil${{ matrix.ext }}

      - name: Rename binary
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/vigil${{ matrix.ext }}"
          DST="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}"
          mv "$SRC" "$DST"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes to the repository; the others get read access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Compute release tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION=$(awk -F'"' '$1 ~ /^version/ {print $2; exit}' Cargo.toml)
          echo "tag=${{ env.BIN_NAME }}/v${VERSION}/${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${{ env.BIN_NAME }} v${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: sha256sum vigil-* > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name:               ${{ steps.meta.outputs.tag }}
          name:                   ${{ steps.meta.outputs.name }}
          target_commitish:       ${{ github.sha }}
          generate_release_notes: true
          files: |
            vigil-*
            SHA256SUMS

      - name: Clean up old releases (keep ${{ env.KEEP_RELEASES }} most recent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: |
          PREFIX="${{ env.BIN_NAME }}/"
          CURRENT_TAG="${{ steps.meta.outputs.tag }}"
          releases=$(gh release list --limit 100 --json tagName \
            | jq -r '.[].tagName' | grep "^${PREFIX}")
          count=0
          for tag in $releases; do
            count=$((count + 1))
            # Never delete the release this job just created, even when
            # KEEP_RELEASES is 0 or a concurrent run changes the list order.
            if [ "$tag" = "$CURRENT_TAG" ]; then
              echo "Keeping:  $tag (current release)"
            elif [ "$count" -gt "${{ env.KEEP_RELEASES }}" ] && [ "$count" -gt 1 ]; then
              echo "Deleting: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            else
              echo "Keeping:  $tag"
            fi
          done
